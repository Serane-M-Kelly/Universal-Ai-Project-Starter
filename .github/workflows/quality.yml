name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-compatibility:
    name: Node ${{ matrix.node }} · Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Récupérer le starter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Installer les dépendances verrouillées
        run: npm ci --ignore-scripts
      - name: Valider le starter
        run: npm run validate

  operating-systems:
    name: Node 24 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Systèmes pris en charge : macOS (ce job) et Linux (job node-compatibility). Windows n'est pas
    # pris en charge ; il sera ajouté avec une version de compatibilité dédiée si un besoin apparaît.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps:
      - name: Récupérer le starter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Installer les dépendances verrouillées
        run: npm ci --ignore-scripts
      - name: Valider le starter
        run: npm run validate
