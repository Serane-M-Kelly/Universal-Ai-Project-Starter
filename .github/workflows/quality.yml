name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-compatibility:
    name: Node ${{ matrix.node }} · Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - name: Récupérer le starter
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Installer les dépendances verrouillées
        run: npm ci --ignore-scripts
      - name: Valider le starter
        run: npm run validate

  operating-systems:
    name: Node 24 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Systèmes pris en charge : macOS (ce job) et Linux (job node-compatibility). Windows n'est pas
    # pris en charge ; il sera ajouté avec une version de compatibilité dédiée si un besoin apparaît.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps:
      - name: Récupérer le starter
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Installer les dépendances verrouillées
        run: npm ci --ignore-scripts
      - name: Valider le starter
        run: npm run validate
